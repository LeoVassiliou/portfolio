*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.rot{display:inline-block;transition:transform .24s cubic-bezier(.3,.7,.2,1),opacity .24s}
.rot-out{transform:translateY(-.45em);opacity:0}
.rot-in{transform:translateY(.45em);opacity:0;transition:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

/* design switcher */
.sw{position:fixed;right:14px;bottom:14px;z-index:9999;font:500 14px/1.35 'Bricolage Grotesque',system-ui,sans-serif}
.sw-btn{width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:#111;display:grid;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.sw-btn:hover svg{transform:rotate(60deg)}
.sw-btn svg{transition:transform .4s}
.sw-panel{position:absolute;right:0;bottom:56px;width:min(300px,calc(100vw - 28px));background:#fff;color:#111;border-radius:16px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.sw-title{margin:2px 6px 8px;font-weight:700}
.sw-opt{display:block;width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:10px;padding:8px 10px}
.sw-opt b{display:block}
.sw-opt span{color:#555;font-size:13px}
.sw-opt:hover{background:#f1f1f1}
.sw-opt[aria-pressed=true]{border-color:#111;background:#f6f6f6}
.sw-note{margin:8px 6px 2px;color:#666;font-size:12px}
[data-theme=kickoff] body{background:#0a3d27}
.ko{--grass:#11663f;--grass2:#0e5a37;--night:#062417;--chalk:#f3f6ee;--yellow:#ffd400;--ink:#0b2a1c;
  font:400 17px/1.55 'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);background:var(--chalk)}
.ko a{text-decoration:none}
.ko-wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* hero */
.ko-hero{position:relative;min-height:100svh;overflow:hidden;color:var(--chalk);touch-action:manipulation;
  background:radial-gradient(120% 80% at 50% 0%,transparent 40%,rgba(3,20,12,.75)),repeating-linear-gradient(90deg,var(--grass) 0 9vw,var(--grass2) 9vw 18vw);
  display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.ko-lines{position:absolute;inset:0;pointer-events:none}
.ko-lines::before{content:"";position:absolute;left:50%;top:50%;width:min(62vw,62vh);aspect-ratio:1;border:3px solid rgba(243,246,238,.2);border-radius:50%;transform:translate(-50%,-50%)}
.ko-lines::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px solid rgba(243,246,238,.2)}
.ko-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.ko-nav{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:16px 22px}
.ko-crest{font:400 20px/1 Anton,sans-serif;letter-spacing:.04em;border:2px solid var(--chalk);padding:7px 8px 6px;border-radius:4px 4px 14px 14px}
.ko-links{display:flex;gap:18px;font-weight:600;font-size:15px}
.ko-links a{padding:6px 0;border-bottom:2px solid transparent}
.ko-links a:hover{border-color:var(--yellow)}
.ko-board{position:relative;z-index:2;align-self:flex-end;margin:6px 22px 0;display:grid;grid-template-columns:auto auto;gap:2px 12px;align-items:center;
  background:#07130d;border:2px solid #1c3528;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;color:#9fb8aa}
.ko-n{font:400 30px/1 Anton,sans-serif;color:var(--yellow);letter-spacing:.06em;text-align:right;text-shadow:0 0 14px rgba(255,212,0,.45)}
.ko-copy{position:relative;z-index:2;margin-top:auto;padding:0 22px 74px;max-width:1080px;width:100%;align-self:center}
.ko h1{font:400 clamp(4.2rem,17vw,12.5rem)/.92 Anton,sans-serif;text-transform:uppercase;margin:0 0 .16em;letter-spacing:.005em}
.ko-line{font-size:clamp(1.5rem,4.6vw,2.9rem);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
.ko-line span{color:var(--yellow)}
.ko-line2{opacity:.92}
.ko-intro{max-width:34em;margin:16px 0 0;color:#d5e3da}
.ko-cta{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 0}
.ko-btn{display:inline-block;background:var(--yellow);color:#111;font-weight:700;padding:12px 20px;border-radius:999px;border:2px solid var(--yellow);transition:transform .15s}
.ko-btn:hover{transform:translateY(-2px)}
.ko-ghost{background:transparent;color:inherit;border-color:currentColor}
.ko-dark{background:var(--ink);border-color:var(--ink);color:var(--chalk)}
.ko-hint{position:absolute;z-index:2;left:22px;bottom:18px;margin:0;font-size:14px;font-weight:600;color:var(--yellow);transition:opacity .4s}
.ko-hint.gone{opacity:0}

/* sections */
.ko-sec{padding:72px 0}
.ko h2{font:400 clamp(2.4rem,7vw,4.4rem)/.95 Anton,sans-serif;text-transform:uppercase;margin:0 0 28px}
.ko h3{font-size:1.5rem;line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:-.01em}
.ko-feature{display:grid;gap:28px;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:26px}
.ko-feature h3{font:400 clamp(2.6rem,8vw,4rem)/1 Anton,sans-serif;text-transform:uppercase}
.ko-feature p{margin:0 0 18px;max-width:34em}
.ko-live{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:0 0 10px!important}
.ko-live i{width:9px;height:9px;border-radius:50%;background:#e11d2e;animation:ko-pulse 1.6s infinite}
@keyframes ko-pulse{50%{opacity:.25}}
.ko-fix{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.ko-fix a{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid #cfd8cc}
.ko-fix a:hover{background:#eef3e6}
.ko-fn{font:400 20px/1 Anton,sans-serif;color:#7a8f82}
.ko-fix b{display:block;line-height:1.2}
.ko-fix em{font-style:normal;font-size:14px;color:#4c6156}
.ko-play{font-weight:700;font-size:13px;background:var(--ink);color:var(--chalk);padding:5px 12px;border-radius:999px}
.ko-two{display:grid;gap:16px;margin-top:16px}
.ko-two article{border:2px solid var(--ink);border-radius:18px;padding:22px}
.ko-two p{margin:0}
.ko-when{font-weight:700;font-size:14px;color:#3d6a52;margin-bottom:6px!important}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function makeLife() {
  const offs = []; let dead = false;
  return {
    on(t, e, f, o) { t.addEventListener(e, f, o); offs.push(() => t.removeEventListener(e, f, o)); },
    raf(f) {
      let id, last = performance.now();
      const loop = t => { if (dead) return; f(Math.min((t - last) / 1000, 0.05), t); last = t; id = requestAnimationFrame(loop); };
      id = requestAnimationFrame(loop); offs.push(() => cancelAnimationFrame(id));
    },
    interval(f, ms) { const id = setInterval(f, ms); offs.push(() => clearInterval(id)); },
    timeout(f, ms) { const id = setTimeout(() => { if (!dead) f(); }, ms); offs.push(() => clearTimeout(id)); },
    kill() { dead = true; offs.forEach(f => f()); }
  };
}

/* Word that swaps every couple of seconds: "I build [games]" */
function rotator(el, words, life, ms = 2100, offset = 0) {
  let i = 0; el.textContent = words[0]; el.classList.add('rot');
  const tick = () => {
    i = (i + 1) % words.length;
    if (REDUCE) { el.textContent = words[i]; return; }
    el.classList.add('rot-out');
    life.timeout(() => {
      el.textContent = words[i];
      el.classList.remove('rot-out'); el.classList.add('rot-in');
      void el.offsetWidth; el.classList.remove('rot-in');
    }, 240);
  };
  life.timeout(() => life.interval(tick, ms), offset);
}

/* ---------- design registry + switcher ---------- */
const THEMES = {};
const DEFAULT_THEME = 'kickoff';
const SHOW_SWITCHER = true;   // set to false once you have picked a design
let currentLife = null, currentTheme = null;

function setTheme(id, save = true) {
  if (!THEMES[id]) id = DEFAULT_THEME;
  if (currentLife) currentLife.kill();
  const root = $('#app');
  root.innerHTML = '';
  document.documentElement.dataset.theme = id;
  window.scrollTo(0, 0);
  currentLife = makeLife(); currentTheme = id;
  THEMES[id].mount(root, currentLife);
  if (save) { try { localStorage.setItem('lv-theme', id); } catch (e) {} }
  $$('.sw-opt').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id));
}

function buildSwitcher() {
  if (!SHOW_SWITCHER) return;
  const wrap = document.createElement('div');
  wrap.className = 'sw';
  wrap.innerHTML = `
    <button class="sw-btn" aria-label="Choose a design" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
    </button>
    <div class="sw-panel" hidden>
      <p class="sw-title">Design</p>
      ${Object.entries(THEMES).map(([id, t]) => `<button class="sw-opt" data-id="${id}" aria-pressed="false"><b>${t.name}</b><span>${t.desc}</span></button>`).join('')}
      <p class="sw-note">Only you need this menu. It comes off before the site goes out.</p>
    </div>`;
  document.body.appendChild(wrap);
  const btn = $('.sw-btn', wrap), panel = $('.sw-panel', wrap);
  const toggle = open => { panel.hidden = !open; btn.setAttribute('aria-expanded', open); };
  btn.addEventListener('click', () => toggle(panel.hidden));
  panel.addEventListener('click', e => {
    const o = e.target.closest('.sw-opt'); if (!o) return;
    setTheme(o.dataset.id); toggle(false);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); const t = document.getElementById(g.dataset.go); if (t) t.scrollIntoView({ behavior: REDUCE ? 'auto' : 'smooth', block: 'start' }); }
});

function boot() {
  buildSwitcher();
  let id = (location.hash || '').slice(1);
  if (!THEMES[id]) { try { id = localStorage.getItem('lv-theme'); } catch (e) { id = null; } }
  setTheme(THEMES[id] ? id : DEFAULT_THEME, false);
}

        about: () => `${D.name}. ${D.intro} ${D.seeking}.`,
        whoami: () => 'Someone thinking about hiring Leo, hopefully.',
        projects: () => `Knowitball (${k.status}): ${k.games.map(g => g[0]).join(', ')}.<br>${D.unity.title}.<br>${D.pi.title}.<br>Type <b>open projects</b> for the full window.`,
        skills: () => D.skills.map(s => s[0]).join(' · '),
        education: () => D.education.map(e => `${e[0]}: ${e[1]}. ${e[2]}`).join('<br>'),
        contact: () => `Email <a href="mailto:${D.email}">${D.email}</a>`,
        cv: () => `<a href="${D.cv}">Download CV (PDF)</a>`,
        ls: () => Object.keys(apps).join('  ') + '  CV.pdf',
        clear: () => { out.innerHTML = ''; return ''; },
        open: a => apps[a] ? (life.timeout(() => open(a), 50), `Opening ${apps[a].title}.`) : `No window called "${esc(a || '')}". Try: ${Object.keys(apps).join(', ')}.`,
        design: a => THEMES[a] ? (life.timeout(() => setTheme(a), 300), `Switching to ${THEMES[a].name}.`) : `Designs: ${Object.keys(THEMES).join(', ')}.`,
        sudo: a => /hire/.test(a || '') ? `Permission granted. Leo is available from 2027. Email <a href="mailto:${D.email}">${D.email}</a>` : 'Nice try. The only sudo command here is <b>sudo hire leo</b>.'
      };
      print(`LeoOS terminal. Type <b>help</b> and press Enter.`);
      life.on($('#os-form'), 'submit', e => {
        e.preventDefault();
        const raw = inp.value.trim(); inp.value = ''; if (!raw) return;
        print(`<span class="os-pr">leo@portfolio:~$</span> ${esc(raw)}`);
        const [c, ...rest] = raw.toLowerCase().split(/\s+/);
        const r = cmds[c] ? cmds[c](rest.join(' ')) : `Command not found: ${esc(c)}. Type <b>help</b>.`;
        if (r) print(r, 'os-r');
      });
      life.on(term, 'click', e => { if (!e.target.closest('a') && !window.getSelection().toString()) inp.focus({ preventScroll: true }); });
    }

    // boot sequence, then open the first windows
    const lines = ['LeoOS 2.0', 'Checking memory ......... OK', 'Loading 6 years of projects ......... OK', 'Mounting /games /web /databases ......... OK', 'Starting desktop'];
    const start = () => { $('#os-boot').classList.add('done'); open('about'); if (!small()) open('terminal'); };
    if (REDUCE) { $('#os-boot').remove(); start(); }
    else {
      lines.forEach((l, i) => life.timeout(() => { $('#os-bootlog').textContent += l + '\n'; }, 150 + i * 190));
      life.timeout(start, 150 + lines.length * 190 + 250);
      life.timeout(() => { const b = $('#os-boot'); if (b) b.remove(); }, 2200);
    }
  }
};
/* ============ Design 3: Headline (giant type that reacts to you) ============ */
THEMES.type = {
  name: 'Headline',
  desc: 'Huge lettering that swells under your cursor or finger.',
  mount(root, life) {
    const k = D.knowitball;
    const letters = w => [...w].map(c => `<span class="ty-l">${c}</span>`).join('');
    root.innerHTML = `
<div class="ty">
  <header class="ty-hero">
    <nav class="ty-nav"><span>Portfolio 2026</span><span class="ty-links"><a href="#" data-go="ty-work">Work</a><a href="#" data-go="ty-skills">Skills</a><a href="#" data-go="ty-contact">Contact</a></span></nav>
    <h1 class="ty-name" aria-label="${D.name}"><span class="ty-row" aria-hidden="true">${letters('LEO')}</span><span class="ty-row" aria-hidden="true">${letters('VASSILIOU')}</span></h1>
    <div class="ty-say">
      <p>I build <span id="ty-r1"></span></p>
      <p>I code in <span id="ty-r2"></span></p>
    </div>
    <div class="ty-foot">
      <p>${D.intro}</p>
      <p class="ty-cta"><span class="ty-chip">${D.seeking}</span><a class="ty-btn" href="${D.cv}">Download CV</a></p>
    </div>
  </header>

  <section class="ty-work" id="ty-work">
    <h2>Work</h2>
    <p class="ty-drag">Swipe sideways</p>
    <div class="ty-rail" tabindex="0" aria-label="Projects">
      <article class="ty-card ty-c1">
        <p class="ty-meta">${k.status}</p>
        <h3>Knowitball</h3>
        <p>${k.blurb}</p>
        <a class="ty-btn" href="${k.url}" target="_blank" rel="noopener">Open the site</a>
      </article>
      ${k.games.map((g, i) => `<a class="ty-card ty-game ty-g${i % 3}" href="${g[2]}" target="_blank" rel="noopener"><p class="ty-meta">Knowitball game</p><h3>${g[0]}</h3><p>${g[1]}</p><span class="ty-go">Play it</span></a>`).join('')}
      <article class="ty-card ty-c2"><p class="ty-meta">${D.unity.when}</p><h3>${D.unity.title}</h3><p>${D.unity.blurb}</p></article>
      <article class="ty-card ty-c3"><p class="ty-meta">${D.pi.when}</p><h3>${D.pi.title}</h3><p>${D.pi.blurb}</p></article>
    </div>
  </section>

  <section class="ty-skills" id="ty-skills">
    <div class="ty-band" aria-hidden="true"><div>${(D.skills.map(s => `<span>${s[0]}</span>`).join('')).repeat(2)}</div></div>
    <div class="ty-wrap">
      <h2>Skills</h2>
      <ul class="ty-list">${D.skills.map(s => `<li><b>${s[0]}</b><span>${s[1]}</span></li>`).join('')}</ul>
      <h2>Education</h2>
      <ul class="ty-list">${D.education.map(e => `<li><b>${e[1]}</b><span>${e[0]}. ${e[2]}</span></li>`).join('')}</ul>
    </div>
  </section>

  <footer class="ty-contact" id="ty-contact">
    <p>${D.seeking}. Say hello.</p>
    <a class="ty-mail" href="mailto:${D.email}">${D.email}</a>
    <p class="ty-cta"><a class="ty-btn" href="${D.cv}">Download CV</a><a class="ty-btn ty-out" href="${k.url}" target="_blank" rel="noopener">knowitball.co.uk</a></p>
  </footer>
</div>`;

    rotator($('#ty-r1'), D.build, life, 2100);
    rotator($('#ty-r2'), D.code, life, 2100, 1050);

    // letters swell near the pointer; a wave runs through them when idle
    const ls = $$('.ty-l'), name = $('.ty-name');
    let px = -1e4, py = -1e4, lastMove = -1e4, cur = ls.map(() => 0), boxes = [];
    const measure = () => { boxes = ls.map(l => { const r = l.getBoundingClientRect(); return [r.left + r.width / 2 + scrollX, r.top + r.height / 2 + scrollY]; }); };
    measure(); life.on(window, 'resize', measure); life.timeout(measure, 400);
    life.on(window, 'pointermove', e => { px = e.pageX; py = e.pageY; lastMove = performance.now(); });
    life.on(name, 'pointerdown', e => { px = e.pageX; py = e.pageY; lastMove = performance.now(); });
    if (!REDUCE) life.raf((dt, t) => {
      if (scrollY > innerHeight) return;
      const idle = t - lastMove > 1600, R = Math.max(160, innerWidth * 0.22);
      ls.forEach((l, i) => {
        let target;
        if (idle) target = Math.max(0, Math.sin(t / 520 - i * 0.55)) ** 2;
        else { const d = Math.hypot(boxes[i][0] - px, boxes[i][1] - py); target = Math.max(0, 1 - d / R) ** 1.4; }
        cur[i] += (target - cur[i]) * Math.min(1, dt * 9);
        const v = cur[i];
        l.style.fontVariationSettings = `"wght" ${(260 + v * 540).toFixed(0)}, "wdth" ${(76 + v * 24).toFixed(1)}`;
        l.style.color = v > 0.5 ? 'var(--sun)' : '';
      });
    });

    // tilt on cards (mouse only)
    if (matchMedia('(hover:hover)').matches && !REDUCE) {
      const rail = $('.ty-rail');
      life.on(rail, 'pointermove', e => {
        const c = e.target.closest('.ty-card'); $$('.ty-card', rail).forEach(x => { if (x !== c) x.style.transform = ''; });
        if (!c) return; const r = c.getBoundingClientRect();
        const rx = ((e.clientY - r.top) / r.height - .5) * -7, ry = ((e.clientX - r.left) / r.width - .5) * 9;
        c.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-6px)`;
      });
      life.on(rail, 'pointerleave', () => $$('.ty-card', rail).forEach(x => x.style.transform = ''));
    }
  }
};
/* ============ Design 4: Orbit (space, with a 3D skill sphere you can spin) ============ */
THEMES.orbit = {
  name: 'Orbit',
  desc: 'Deep space. A 3D sphere of skills you can spin.',
  mount(root, life) {
    const k = D.knowitball;
    root.innerHTML = `
<div class="ob">
  <canvas class="ob-stars" aria-hidden="true"></canvas>
  <nav class="ob-nav"><span class="ob-logo">Leo Vassiliou</span><span class="ob-links"><a href="#" data-go="ob-work">Work</a><a href="#" data-go="ob-edu">Education</a><a href="#" data-go="ob-contact">Contact</a></span></nav>
  <header class="ob-hero">
    <div class="ob-copy">
      <p class="ob-seek"><i></i>${D.seeking}</p>
      <h1>I build <em id="ob-r1"></em><br>and I code in <em id="ob-r2"></em></h1>
      <p class="ob-intro">I'm Leo. ${D.intro}</p>
      <p class="ob-cta"><a class="ob-btn" href="#" data-go="ob-work">See my work</a><a class="ob-btn ob-line" href="${D.cv}">Download CV</a></p>
    </div>
    <div class="ob-globe">
      <div class="ob-sphere" id="ob-sphere" role="list" aria-label="Skills">
        ${D.skills.map(s => `<span class="ob-tag" role="listitem">${s[0]}</span>`).join('')}
      </div>
      <p class="ob-tip" id="ob-tip">Drag to spin. Tap a skill.</p>
    </div>
  </header>

  <section class="ob-sec" id="ob-work">
    <h2>Work in orbit</h2>
    <article class="ob-panel ob-main">
      <div class="ob-planet" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="ob-meta">${k.status}</p>
      <h3>Knowitball</h3>
      <p>${k.blurb}</p>
      <ul class="ob-moons">${k.games.map(g => `<li><a href="${g[2]}" target="_blank" rel="noopener"><b>${g[0]}</b><span>${g[1]}</span></a></li>`).join('')}</ul>
      <a class="ob-btn" href="${k.url}" target="_blank" rel="noopener">Open knowitball.co.uk</a>
    </article>
    <div class="ob-pair">
      <article class="ob-panel"><p class="ob-meta">${D.unity.when}</p><h3>${D.unity.title}</h3><p>${D.unity.blurb}</p></article>
      <article class="ob-panel"><p class="ob-meta">${D.pi.when}</p><h3>${D.pi.title}</h3><p>${D.pi.blurb}</p></article>
    </div>
  </section>

  <section class="ob-sec" id="ob-edu">
    <h2>Education</h2>
    <ol class="ob-path">${D.education.map(e => `<li><p class="ob-meta">${e[0]}</p><h3>${e[1]}</h3><p>${e[2]}</p></li>`).join('')}</ol>
  </section>

  <footer class="ob-sec ob-contact" id="ob-contact">
    <h2>Make contact</h2>
    <p>${D.seeking}. Email is the fastest way to reach me.</p>
    <a class="ob-mail" href="mailto:${D.email}">${D.email}</a>
    <p class="ob-cta"><a class="ob-btn" href="${D.cv}">Download CV</a><a class="ob-btn ob-line" href="${k.url}" target="_blank" rel="noopener">knowitball.co.uk</a></p>
  </footer>
</div>`;

    rotator($('#ob-r1'), D.build, life, 2300);
    rotator($('#ob-r2'), D.code, life, 2300, 1150);

    // ---------- starfield ----------
    const cv = $('.ob-stars'), ctx = cv.getContext('2d'); let W, H, dpr, stars = [];
    function size() {
      dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      stars = Array.from({ length: Math.round(W * H / 6500) }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.9 + 0.1, p: Math.random() * 6.3 }));
    }
    size(); life.on(window, 'resize', size);

    // ---------- skill sphere ----------
    const sph = $('#ob-sphere'), tags = $$('.ob-tag', sph), n = tags.length;
    const pts = tags.map((_, i) => { const y = 1 - (i + 0.5) * 2 / n, r = Math.sqrt(1 - y * y), a = i * 2.39996; return [Math.cos(a) * r, y, Math.sin(a) * r]; });
    let rx = -0.25, ry = 0, vx = 0, vy = 0.35, dragging = false, lx = 0, ly = 0, moved = 0;
    life.on(sph, 'pointerdown', e => { dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; sph.setPointerCapture(e.pointerId); });
    life.on(sph, 'pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
      vy = dx * 0.6; vx = -dy * 0.6; ry += dx * 0.008; rx -= dy * 0.008;
    });
    const end = e => {
      if (!dragging) return; dragging = false;
      if (moved < 8) { // a tap: pick the nearest skill to the pointer
        let bestT = null, bd = 1e9;
        tags.forEach(t => { const r = t.getBoundingClientRect(); const d = Math.hypot(r.left + r.width / 2 - e.clientX, r.top + r.height / 2 - e.clientY) - (+t.dataset.z || 0) * 20; if (d < bd) { bd = d; bestT = t; } });
        if (bestT && bd < 70) { const s = D.skills[tags.indexOf(bestT)]; tags.forEach(t => t.classList.toggle('on', t === bestT)); $('#ob-tip').innerHTML = `<b>${s[0]}</b> ${s[1]}`; }
      }
    };
    life.on(sph, 'pointerup', end); life.on(sph, 'pointercancel', () => { dragging = false; });

    function place() {
      const R = sph.clientWidth * 0.4, cx = Math.cos(rx), sx = Math.sin(rx), cy = Math.cos(ry), sy = Math.sin(ry);
      pts.forEach((p, i) => {
        const x1 = p[0] * cy + p[2] * sy, z1 = -p[0] * sy + p[2] * cy;
        const y2 = p[1] * cx - z1 * sx, z2 = p[1] * sx + z1 * cx;
        const s = 0.62 + (z2 + 1) * 0.3, t = tags[i];
        t.style.transform = `translate(-50%,-50%) translate(${(x1 * R).toFixed(1)}px,${(y2 * R).toFixed(1)}px) scale(${s.toFixed(3)})`;
        t.style.opacity = (0.28 + (z2 + 1) * 0.36).toFixed(2); t.style.zIndex = Math.round((z2 + 1) * 50); t.dataset.z = z2.toFixed(2);
      });
    }
    place();

    life.raf((dt, t) => {
      if (!dragging) { ry += vy * dt; rx += vx * dt; vx *= 0.95; vy += (0.35 * Math.sign(vy || 1) - vy) * 0.02; rx += (-0.25 - rx) * 0.01; }
      if (!REDUCE || dragging) place();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      const sc = scrollY;
      for (const s of stars) {
        const y = ((s.y - sc * s.z * 0.25) % H + H) % H;
        const tw = REDUCE ? 0.8 : 0.55 + 0.45 * Math.sin(t / 900 + s.p);
        ctx.fillStyle = `rgba(${s.z > 0.75 ? '255,205,170' : '214,205,255'},${(tw * s.z).toFixed(2)})`;
        const r = s.z * 1.5; ctx.fillRect(s.x, y, r, r);
      }
    });
  }
};
